[project]
name = "journal-mcp"
version = "0.1.0"
description = "MCP server exposing a local SQLite trading journal as persistent memory for Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
journal-mcp = "journal_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_mcp"]
